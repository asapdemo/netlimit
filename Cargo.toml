[package]
name = "netlimit"
version = "0.1.0"
edition = "2021"
description = "Interactive TUI for system-wide Linux network traffic control"
license = "MIT"
readme = "README.md"
keywords = ["network", "tui", "tc", "netem", "bandwidth"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "netlimit"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
