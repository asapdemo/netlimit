[project]
name = "netlimit"
version = "0.1.0"
description = "Interactive TUI for system-wide network traffic control on Linux"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0.0",
]
keywords = ["network", "traffic-control", "tui", "tc", "netem", "bandwidth"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]

[project.scripts]
netlimit = "netlimit.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["netlimit"]

# Ship Textual stylesheet with the package
[tool.hatch.build.targets.wheel.force-include]
"netlimit/ui/styles.tcss" = "netlimit/ui/styles.tcss"
